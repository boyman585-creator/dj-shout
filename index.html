<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>DJ SHOUT</title>
<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #101020;
color: white;
text-align: center;
}
header {
padding: 35px 15px;
background: linear-gradient(135deg,#7c3aed,#ec4899);
}
h1 { font-size: 42px; margin: 0; }
main { padding: 20px; }
.card {
background: #202039;
padding: 22px;
border-radius: 16px;
margin: 16px auto;
max-width: 450px;
}
input, select, button {
box-sizing: border-box;
width: 100%;
padding: 14px;
margin: 8px 0;
border-radius: 9px;
border: none;
font-size: 16px;
}
button {
background: #a855f7;
color: white;
font-weight: bold;
cursor: pointer;
}
.price { color: #facc15; }
#result { margin-top: 15px; }
</style>
</head>
<body>
<header>
<h1>🎧 DJ SHOUT</h1>
<p>Твоето послание. Твоята музика. Твоята вечер.</p>
</header>

<main>
<section class="card">
<h2>🎤 Изпрати поздрав</h2>
<input id="message" placeholder="Напиши своя поздрав">
<select id="service">
<option value="10">Поздрав към DJ - 10 €</option>
<option value="20">Поръчка на песен - 20 €</option>
<option value="30">Поздрав на голям екран - 30 €</option>
<option value="40">VIP поздрав - 40 €</option>
</select>
<h3 class="price" id="price">Цена: 10 €</h3>
<button onclick="sendRequest()">Продължи</button>
<p id="result" role="status"></p>
</section>

<section class="card">
<h2>🍾 VIP резервации</h2>
<p>Резервирай VIP маса в любимия си клуб.</p>
<button onclick="showComingSoon()">
Разгледай VIP маси
</button>
</section>

<section class="card">
<h2>🎉 Събития</h2>
<p>Открий DJ участия, изпълнители и промоции.</p>
<button onclick="showComingSoon()">
Виж събития
</button>
</section>
</main>

<script>
const service = document.getElementById("service");
const price = document.getElementById("price");
const result = document.getElementById("result");

service.addEventListener("change", () => {
price.textContent = "Цена: " + service.value + " €";
});

function sendRequest() {
const message = document.getElementById("message").value.trim();
if (!message) {
result.textContent = "Моля, напиши поздрав.";
return;
}
result.textContent =
"Демо заявка: " + message +
". Цена: " + service.value +
" €. Все още няма реално плащане.";
}

function showComingSoon() {
alert("Тази функция предстои да бъде разработена.");
}
</script>
</body>
</html>
